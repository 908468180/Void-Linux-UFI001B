name: Build Void Linux UFI001B

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Debug
        run: |
          pwd
          ls -la
          ls -la build.sh
          file build.sh
          cat build.sh | head -5

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log
          echo "EXIT CODE: $?"

      - name: Show build log tail
        if: always()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          tail -50 build.log 2>/dev/null || echo "no build.log"

      - name: Upload rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b-rootfs
          path: build/rootfs/
          if-no-files-found: warn
