name: Build Void Linux UFI001B

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Show environment
        run: |
          uname -a
          ls /usr/bin/qemu-* 2>/dev/null || echo "no qemu binaries"
          which curl

      - name: Build
        run: bash -x build.sh 2>&1 | tail -200

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b
          path: out/
