name: Build Void Linux UFI001B

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build
        run: bash build.sh

      - name: Debug build output
        if: always()
        run: |
          echo "=== build/ contents ==="
          ls -lhR build/ 2>/dev/null || echo "no build/"
          echo "=== out/ contents ==="
          ls -lh out/ 2>/dev/null || echo "no out/"

      - name: Upload rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b-rootfs
          path: build/rootfs/
          if-no-files-found: warn

      - name: Upload tarball
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b-tarball
          path: out/*.tar.xz
          if-no-files-found: warn
