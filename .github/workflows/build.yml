name: Build Void Linux UFI001B

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Download & Extract Void ROOTFS
        run: |
          mkdir -p build out rootfs
          curl -fSL -o build/void-rootfs.tar.xz \
            "https://repo-default.voidlinux.org/live/current/void-aarch64-ROOTFS-20250202.tar.xz"
          tar -Jxf build/void-rootfs.tar.xz -C rootfs --strip-components=1

      - name: Install packages
        run: |
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo mount --bind /dev rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo mount -t sysfs sysfs rootfs/sys
          sudo mount --bind /dev/pts rootfs/dev/pts
          set +e
          sudo chroot rootfs xbps-install -S > /tmp/xbps-sync.log 2>&1
          echo "xbps-sync exit=$?" > /tmp/install.log
          cat /tmp/xbps-sync.log >> /tmp/install.log
          sudo chroot rootfs xbps-install -y \
            bash coreutils curl dnsmasq dropbear ethtool findutils grep \
            iproute2 iw kmod nano procps sed sudo tar udev usbutils \
            wget which wpa_supplicant xbps xz > /tmp/xbps-install.log 2>&1
          echo "xbps-install exit=$?" >> /tmp/install.log
          cat /tmp/xbps-install.log >> /tmp/install.log
          sudo umount rootfs/dev/pts rootfs/dev rootfs/proc rootfs/sys 2>/dev/null
          cat /tmp/install.log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: /tmp/install.log
          if-no-files-found: warn

      - name: Configure
        if: success()
        run: |
          echo "root:root" | sudo chroot rootfs chpasswd
          echo "ufi001b" | sudo tee rootfs/etc/hostname
          echo "LANG=en_US.UTF-8" | sudo tee rootfs/etc/locale.conf

      - name: Overlay + firmware
        if: success()
        run: |
          sudo cp -a overlay/. rootfs/
          sudo mkdir -p rootfs/lib/firmware/wlan/prima
          sudo cp vendor/lib/firmware/wcnss*.mdt rootfs/lib/firmware/ 2>/dev/null || true
          sudo cp vendor/lib/firmware/wcnss*.b* rootfs/lib/firmware/ 2>/dev/null || true
          sudo cp vendor/lib/firmware/wlan/prima/WCNSS_qcom_wlan_nv.bin rootfs/lib/firmware/wlan/prima/ 2>/dev/null || true
          sudo mkdir -p rootfs/var/service
          for svc in dropbear dnsmasq usb-gadget; do
            [ -d "rootfs/etc/sv/$svc" ] && sudo ln -sf "/etc/sv/$svc" "rootfs/var/service/$svc"
          done

      - name: Pack rootfs
        if: success()
        run: |
          sudo tar -Jcf out/rootfs.tar.xz -C rootfs .

      - name: Upload rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b
          path: out/rootfs.tar.xz
          if-no-files-found: error
