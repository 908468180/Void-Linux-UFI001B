name: Build Void Linux UFI001B

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build
        run: |
          bash build.sh 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show build log tail
        if: failure()
        run: |
          echo "=== TAIL OF BUILD LOG ==="
          tail -80 build.log

      - name: Upload rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b-rootfs
          path: build/rootfs/
          if-no-files-found: error
