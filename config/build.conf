# Void Linux glibc build configuration for UFI001B
ARCH=aarch64
GLIBC=glibc
VOID_MIRROR=https://repo-default.voidlinux.org/current
ROOTFS_TARBALL=void-aarch64-ROOTFS-20250202.tar.xz

# Kernel (pmOS mainline for MSM8916)
# Live packages: <KERNEL_MIRROR>linux-postmarketos-qcom-msm8916-<VERSION>.apk
KERNEL_MIRROR=http://mirror.postmarketos.org/postmarketos/main/aarch64/
KERNEL_APK=linux-postmarketos-qcom-msm8916-6.12.1-r6.apk

# Device tree (UFI001B/C: thwc,ufi001c)
KERNEL_DTB=msm8916-thwc-ufi001c.dtb

# Root partition PARTUUID (must match extlinux.conf / flash script)
ROOT_PARTUUID=a7ab80e8-e9d1-e8cd-f157-93f69b1d141e

# ---- bootloader (qhypstub + lk1st) ----
# lk1st compatible must match the bundled device DTB. UFI001B/C: thwc,ufi001c
LK1ST_COMPATIBLE=thwc,ufi001c
LK1ST_BUNDLE_DTB=msm8916-512mb-mtp.dtb

# ---- stock Qualcomm firmware (rpm/sbl1/tz, from DragonBoard 410c) ----
DB410C_FW_URL=https://archive.org/download/dragonboard-410c-bootloader-emmc-linux-176/dragonboard-410c-bootloader-emmc-linux-176.zip
DB410C_FW_SHA256=a37c4e82a970ae2350fcfc7180559caf1dc3928e7c169316fe4ab899b7d305ad
DB410C_FW_ZIP=dragonboard-410c-bootloader-emmc-linux-176

# ---- DTB patch knobs ----
# 0 = stock CPU table (<=998.4 MHz); >0 = up to N MHz (400/800/1000/.../N).
CPU_OPP_MHZ=1200
# 1 = delete modem carve-out (~85 MiB extra RAM; modem off).
RELEASE_MEMORY=1

# ---- eMMC geometry (from the 001b factory backup: 7,569,375 sectors) ----
DISK_TOTAL_SECTORS=7569375