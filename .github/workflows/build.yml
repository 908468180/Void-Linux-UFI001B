name: Build Void Linux UFI001B

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Check script
        run: |
          file build.sh
          head -1 build.sh
          cat -A build.sh | head -3
          bash -n build.sh && echo "syntax OK" || echo "syntax ERROR"

      - name: Build
        run: bash build.sh

      - name: Upload rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-ufi001b-rootfs
          path: build/rootfs/
          if-no-files-found: warn
